[package]
name = "makine"
description = "Build a computer from NAND gates"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
makine-lang = { path = "../lang" }
sys-locale = "0.3"
makine-sim = { path = "../sim", features = ["serde"] }
makine-levels = { path = "../levels" }
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rfd = "0.17"
egui_commonmark = "0.26"
egui_extras = { version = "0.37", features = ["svg", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
makine-rv = { path = "../rv" }
makine-pack = { path = "../pack" }
makine-world = { path = "../world" }
makine-net = { path = "../net" }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
